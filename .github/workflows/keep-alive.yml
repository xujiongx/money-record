name: Keep Supabase Alive

on:
  schedule:
    # 每周一次（UTC 周一 02:00），保持 Supabase 项目在活跃期内
    - cron: '0 2 * * 1'
  workflow_dispatch:   # 允许手动触发

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call /api/health
        run: |
          STATUS=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.HEALTH_CHECK_SECRET }}" \
            "${{ secrets.HEALTH_CHECK_URL }}")
          echo "HTTP $STATUS"
          cat /tmp/body.json
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
