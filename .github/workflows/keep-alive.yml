name: Keep Supabase Alive

on:
  schedule:
    # 每 20 天执行一次（UTC 时间 02:00），确保在 30 天活跃期内有访问
    # cron 语法不支持"每 N 天"，用固定日期列表模拟：1/21 号各触发一次
    - cron: '0 2 1,21 * *'
  workflow_dispatch:   # 允许手动触发

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call /api/health
        run: |
          STATUS=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.HEALTH_CHECK_SECRET }}" \
            "${{ secrets.HEALTH_CHECK_URL }}")
          echo "HTTP $STATUS"
          cat /tmp/body.json
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
